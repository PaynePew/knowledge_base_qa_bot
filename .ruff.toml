# Repo-wide ruff config (issue #690 rework). Ruff resolves the closest
# ruff.toml / .ruff.toml / pyproject.toml **containing a [tool.ruff] table**
# walking up from each file. A ruff.toml or .ruff.toml counts unconditionally
# once found, but a pyproject.toml with no [tool.ruff] table does NOT stop
# the walk - ruff skips over it and keeps climbing toward the next candidate
# further up the tree. Before this file existed, any path with no local
# pyproject.toml of its own (eval/corpus_v3, eval/cost_ledger,
# project-docs/, ops/, deploy/, ...) climbed past the workspace root
# pyproject.toml too - it also has no [tool.ruff] section - found nothing
# further up, and silently fell back to ruff's built-in 88-col default
# instead of this repo's documented 100 (CODING_STANDARD 8.1). That mismatch
# produced false format drift on PR #684 and again on #686.
#
# A prior fix for this (issue #690) added a standalone pyproject.toml under
# each of eval/corpus_v3 and eval/cost_ledger to pin line-length=100. An
# adversarial verifier caught the side effect: a bare pyproject.toml is also
# how uv identifies a project root, so `uv run` (and pytest collection via
# uv) executed from inside either directory treated it as its own project
# and provisioned a stray, wrong-Python nested .venv there instead of using
# the workspace root's .venv. This root-level .ruff.toml is ruff-only syntax
# (uv never reads *.ruff.toml files), so it fixes the same config-resolution
# gap with no uv side effect.
#
# The four workspace members that already carry their own [tool.ruff] in
# their pyproject.toml (markdown_kb, gateway, kb_mcp, kb_cli) stop the walk
# at their own file and are unaffected by this one. vector_rag, hybrid_kb,
# and eval/paraphrase_comparison each have a pyproject.toml of their own,
# but it has no [tool.ruff] table - so per the rule above the walk does NOT
# stop there. It climbs past them and resolves to THIS root file instead
# (verified: from inside vector_rag/, `ruff check --verbose` logs this
# .ruff.toml as the resolved config, not vector_rag/pyproject.toml, and
# `--show-settings` reports line_length = 100 from it) - which is why the
# initial 100-col sweep (PR #694) legitimately reformatted their files too;
# they were never out of scope.
line-length = 100
